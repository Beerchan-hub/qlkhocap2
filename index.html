<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quản lý kho</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eaf3ff,
                    #f7f9fc
                );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        .container {

            width: 100%;

            max-width: 480px;

            background: white;

            border-radius: 20px;

            padding: 40px 30px;

            text-align: center;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.15);
        }


        .icon {

            font-size: 65px;

            margin-bottom: 10px;
        }


        h1 {

            margin: 0;

            font-size: 30px;

            color: #1f2937;
        }


        .subtitle {

            margin-top: 10px;

            margin-bottom: 30px;

            color: #6b7280;

            font-size: 16px;
        }


        .btn {

            display: block;

            width: 100%;

            padding: 16px;

            background: #1677ff;

            color: white;

            text-decoration: none;

            border: none;

            border-radius: 10px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .btn:hover {

            background: #0958d9;

            transform: translateY(-1px);
        }


        .btn:active {

            transform: translateY(0);
        }


        .btn:disabled {

            opacity: 0.6;

            cursor: wait;

        }


        .status {

            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            background: #f3f4f6;

            color: #6b7280;

            font-size: 14px;

            word-break: break-word;
        }


        .url {

            margin-top: 12px;

            font-size: 12px;

            color: #9ca3af;

            word-break: break-all;

            line-height: 1.5;
        }


        .footer {

            margin-top: 25px;

            font-size: 12px;

            color: #9ca3af;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="icon">
        📦
    </div>


    <h1>
        QUẢN LÝ KHO
    </h1>


    <div class="subtitle">
        Hệ thống quản lý phụ tùng
    </div>


    <button
        id="btnVaoHeThong"
        class="btn"
        type="button"
    >
        🚀 VÀO HỆ THỐNG
    </button>


    <div
        id="status"
        class="status"
    >
        🔄 Đang kiểm tra kết nối...
    </div>


    <div
        id="url"
        class="url"
    >
    </div>


    <div class="footer">
        © 2026 Hệ thống quản lý kho
    </div>


</div>


<script>


// =====================================================
// CẤU HÌNH
// =====================================================

const DASHBOARD_PATH = "/dashboard";

const LOGIN_PATH = "/dashboard/login";


// =====================================================
// LẤY PHẦN TỬ GIAO DIỆN
// =====================================================

const statusElement =
    document.getElementById("status");

const urlElement =
    document.getElementById("url");

const buttonElement =
    document.getElementById("btnVaoHeThong");


// =====================================================
// HÀM LẤY URL CLOUDFLARE TỪ url.txt
// =====================================================

async function layUrlCloudflare() {

    try {

        const response =
            await fetch(
                "./url.txt?t=" + Date.now(),
                {
                    cache: "no-store"
                }
            );


        // -------------------------------------------------
        // KIỂM TRA HTTP
        // -------------------------------------------------

        if (!response.ok) {

            throw new Error(
                "Không đọc được url.txt - HTTP " +
                response.status
            );

        }


        // -------------------------------------------------
        // ĐỌC NỘI DUNG
        // -------------------------------------------------

        const text =
            await response.text();


        const url =
            text.trim();


        // -------------------------------------------------
        // KIỂM TRA TRỐNG
        // -------------------------------------------------

        if (!url) {

            throw new Error(
                "url.txt đang trống"
            );

        }


        // -------------------------------------------------
        // KIỂM TRA HTTPS
        // -------------------------------------------------

        if (
            !url.startsWith("https://")
        ) {

            throw new Error(
                "URL Cloudflare không hợp lệ"
            );

        }


        // -------------------------------------------------
        // LOẠI BỎ / CUỐI
        // -------------------------------------------------

        return url.replace(
            /\/+$/,
            ""
        );

    }

    catch (error) {

        console.error(
            "Lỗi lấy URL Cloudflare:",
            error
        );

        throw error;

    }

}


// =====================================================
// TẠO URL LOGIN DASHBOARD
// =====================================================

function taoLoginUrl(cloudflareUrl) {

    return (
        cloudflareUrl +
        LOGIN_PATH
    );

}


// =====================================================
// NÚT VÀO HỆ THỐNG
// =====================================================

async function vaoHeThong() {


    // -------------------------------------------------
    // TRẠNG THÁI
    // -------------------------------------------------

    statusElement.innerHTML =
        "🔄 Đang lấy địa chỉ hệ thống...";


    urlElement.textContent =
        "";


    // -------------------------------------------------
    // KHÓA NÚT
    // -------------------------------------------------

    buttonElement.disabled =
        true;


    try {


        // =================================================
        // LẤY URL CLOUDFLARE
        // =================================================

        const cloudflareUrl =
            await layUrlCloudflare();


        console.log(
            "Cloudflare URL:",
            cloudflareUrl
        );


        // =================================================
        // HIỂN THỊ URL CLOUDFLARE
        // =================================================

        urlElement.textContent =
            "Cloudflare: " +
            cloudflareUrl;


        // =================================================
        // TẠO URL LOGIN
        // =================================================

        const loginUrl =
            taoLoginUrl(
                cloudflareUrl
            );


        console.log(
            "Login URL:",
            loginUrl
        );


        // =================================================
        // HIỂN THỊ TRẠNG THÁI
        // =================================================

        statusElement.innerHTML =
            "✅ Đang mở trang đăng nhập...";


        // =================================================
        // CHUYỂN SANG DASHBOARD LOGIN
        // =================================================

        window.location.href =
            loginUrl;


    }

    catch (error) {


        // =================================================
        // XỬ LÝ LỖI
        // =================================================

        console.error(
            "Lỗi:",
            error
        );


        statusElement.innerHTML =
            "❌ Không lấy được địa chỉ hệ thống";


        urlElement.textContent =
            "";


        alert(

            "❌ KHÔNG THỂ VÀO HỆ THỐNG\n\n" +

            error.message +

            "\n\n" +

            "Hãy kiểm tra:\n" +

            "1. File url.txt có tồn tại không\n" +

            "2. url.txt có chứa URL Cloudflare không\n" +

            "3. Cloudflare Quick Tunnel đã chạy chưa\n" +

            "4. Node-RED đang chạy tại localhost:1880"

        );

    }


    finally {


        // =================================================
        // MỞ KHÓA NÚT
        // =================================================

        buttonElement.disabled =
            false;

    }

}


// =====================================================
// KIỂM TRA URL KHI MỞ GITHUB PAGES
// =====================================================

async function kiemTraTrang() {


    statusElement.innerHTML =
        "🔄 Đang kiểm tra địa chỉ hệ thống...";


    try {


        // =================================================
        // LẤY URL
        // =================================================

        const cloudflareUrl =
            await layUrlCloudflare();


        console.log(
            "URL Cloudflare hiện tại:",
            cloudflareUrl
        );


        // =================================================
        // HIỂN THỊ URL
        // =================================================

        urlElement.textContent =
            "Cloudflare: " +
            cloudflareUrl;


        // =================================================
        // HIỂN THỊ TRẠNG THÁI
        // =================================================

        statusElement.innerHTML =
            "🟢 Hệ thống sẵn sàng";


    }

    catch (error) {


        console.warn(
            "Chưa lấy được URL Cloudflare:",
            error
        );


        statusElement.innerHTML =
            "🟡 Chưa có địa chỉ Cloudflare";


        urlElement.textContent =
            "";

    }

}


// =====================================================
// GÁN SỰ KIỆN CHO NÚT
// =====================================================

buttonElement.addEventListener(
    "click",
    vaoHeThong
);


// =====================================================
// CHẠY KHI TRANG ĐƯỢC MỞ
// =====================================================

window.addEventListener(
    "load",
    kiemTraTrang
);


</script>


</body>

</html>
